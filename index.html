<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusCare — Smart Campus Problem Solver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="workspace-layout" class="workspace-layout">
    <div id="app-shell" class="app-shell">
      <!-- Top App Bar (hidden on Splash & Role Selection) -->
      <header id="top-bar" class="top-bar hidden">
        <div class="top-bar-left">
          <div id="top-bar-logo" class="top-bar-logo"></div>
          <div class="top-bar-titles">
            <div id="top-bar-title" class="top-bar-title">CampusCare</div>
            <div id="top-bar-subtitle" class="top-bar-subtitle">Student · Demo</div>
          </div>
        </div>
        <div class="top-bar-actions">
          <button id="btn-toggle-aside" class="btn-switch-role" type="button" title="View Backend &amp; Data Flow">
            <span id="aside-toggle-dot" class="status-dot-mini"></span>
            <span>Data</span>
          </button>
          <button id="btn-switch-role" class="btn-switch-role" type="button" title="Switch Portal View">
            <span class="switch-icon" id="switch-role-icon"></span>
            <span id="switch-role-label">Admin Panel</span>
          </button>
          <button id="btn-signout" class="btn-icon-ghost" type="button" title="Sign Out" aria-label="Sign Out"></button>
        </div>
      </header>

      <!-- Main Content Outlet -->
      <main id="main-content" class="main-content"></main>

      <!-- Bottom Navigation Bar (hidden on Splash & Role Selection) -->
      <nav id="bottom-nav" class="bottom-nav hidden" aria-label="Primary Navigation"></nav>
    </div>

    <!-- Live Backend & Data Flow Aside -->
    <aside id="data-aside" class="data-aside hidden" aria-label="Backend Storage and Data Flow"></aside>
  </div>

  <!-- Snackbar / Toast Banner -->
  <div id="snackbar" class="snackbar hidden" role="status" aria-live="polite">
    <span id="snackbar-message"></span>
    <button id="snackbar-close" class="snackbar-close" type="button" aria-label="Dismiss">&times;</button>
  </div>

  <!-- Modal / Bottom Sheet Overlay -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-sheet" id="modal-sheet">
      <div class="modal-handle-row">
        <div class="modal-handle"></div>
        <button id="modal-close-btn" class="modal-close-btn" type="button" aria-label="Close">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script defer src="js/icons.js"></script>
  <script defer src="js/models.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
